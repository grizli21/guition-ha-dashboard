; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = ./board
; 08/11/2026 (décision du jour : la prod passe en LVGL 9.6) : l'env par défaut est celui de PRODUCTION 9.6, « ecran ».
; Le soir du 08/11, renommage et tri (retour d'usage : l'ancien nom de banc ne veut plus rien dire, c'est le firmware de
; production) : les envs 8.4 sont
; sortis du fichier (ils ne compilaient plus ici — les icônes de lib/ressources sont au format 9.6). Un « pio run »
; sans -e compile la prod.
default_envs = ecran

; 23/10/2026 : projet SÉPARÉ de l'ancien firmware (séparation totale).
; Simulateur PC : make -C simu (même lv_conf.h, mêmes pages).

; --- commun à tous les environnements ---
[env]
; 25/10/2026 : branche arduino3 : Arduino 3.3.12 / ESP-IDF 5.5.5 (dernière stable), plateforme pioarduino figée
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
monitor_speed = 115200

; --- PARTITIONS ---
; Utilise celle-ci pour avoir ~10MB de stockage LittleFS
board_build.partitions = large_spiffs_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = dio_opi

monitor_filters = esp32_exception_decoder

lib_deps =
    ressources
    icones
; 27/10/2026 : JPEGDEC n'est plus dans le firmware (esp_new_jpeg, fourni avec l'Arduino 3) ; lib/JPEGDEC-1.8.4 ne sert
; plus qu'au simulateur (simu/Makefile). PlatformIO le tirerait sinon sur un #include protégé par #ifndef ARDUINO
lib_ignore = JPEGDEC
; 02/11/2026 : version du firmware (commit git) dans include/version_git.h : page Infos et ligne « Démarrage » du journal
extra_scripts = pre:version_git.py

; 25/10/2026 : -O2 au lieu de -Os (plus rapide, un peu plus gros ; la flash n'est qu'à 39 %)
; -mfix-esp32-psram-cache-issue vient AUSSI de la carte (board/…n16r8v.json, extra_flags) : retiré ici pour de bon
build_unflags = -Os -mfix-esp32-psram-cache-issue
build_flags =
    -O2
    -I include
    -D BOARD_HAS_PSRAM
    ; option : police pixel « 3x5 » de K-Type pour les valeurs chiffrées (à télécharger soi-même, usage personnel ;
    ; voir tools/fonts/README.md). Sans elle : Montserrat Bold.
    ; -D POLICE_3X5
    ; 25/10/2026 : -mfix-esp32-psram-cache-issue RETIRÉ : correctif du tout premier ESP32 (seules les cartes « esp32 » de
    ; PlatformIO l'ont, CONFIG_SPIRAM_CACHE_WORKAROUND absent du sdkconfig esp32s3) ; sur S3 il ajoutait des barrières memw
    ; dans les boucles de pixels

upload_protocol = espota

; =========================================================================
; PRODUCTION : UN SEUL ENV, commun aux trois écrans. La pièce se décide par la MAC (table ECRANS[] de
; src/ecran/ecran.cpp) : l'env ne sert qu'à choisir comment flasher (OTA ou câble) et avec quels drapeaux.
;   pio run -e ecran -t upload --upload-port 192.168.1.41   (l'IP statique de ton écran)
;   pio run -e ecran-usb -t upload --upload-port /dev/ttyUSB0   (câble ; le port n'est PAS fixé ici : aucun adaptateur
;   n'est branché sur ce poste et le dépôt ne cite aucun chemin by-id — vérifier `ls /dev/serial/by-id/` avant)
; 18/10/2026 : banc de la nouvelle interface (src/ecran/ + src/ui_lvgl/), Wi-Fi + OTA gardés.
; 26/10 : l'écran se reconnaît à sa MAC : les envs ne servent plus qu'à choisir où flasher (IP ou câble) et les options
; de banc. 29/10 : TOUS les écrans ont les réglages de la chambre 1 (Arduino RECOMPILÉ, pioarduino + custom_sdkconfig,
; compilation dans un dossier sans espaces) : fenêtre TCP de 32 Ko au lieu de 5 760 octets, fenêtre Wi-Fi (BA) de 6 à 16,
; Wi-Fi et lwIP en IRAM et en RAM interne. ⚠️ avec cette fenêtre, un flux caméra non lu bloque ~22 des 32 tampons de
; réception du Wi-Fi (écran « sourd ») : la caméra DOIT couper ses flux quand elle n'est plus affichée
; (ui_camera_couper). 08/11 : la prod passe en LVGL 9.6 (retour d'usage) ; 08/11 soir : l'ancien nom de banc devient « ecran »
; (retour d'usage : le nom ne veut plus rien dire, c'est le firmware de production).
; Ce qui fait basculer la compilation sur la 9.6 (mesuré, pas supposé) :
;   - lib_deps lvgl@9.6.0 : la 9.6 devient une dépendance DÉCLARÉE, donc triée avant les autres par GetLibBuilders() ;
;     lib_ignore compare au NOM DU MANIFESTE (piolib.py : lb.name = « lvgl » pour les deux dossiers) -> « lvgl-8.4.0 »
;     ne correspond à rien et « lvgl » ignorerait LES DEUX ; vérifié : plus aucun objet lvgl-8.4.0 dans .pio/build ;
;   - -I conf_v9 AVANT -I include : include/lv_conf.h est celui de la 8.4, sinon il gagne ; conf_v9/lv_conf.h (9.6) est
;     suivi et regénéré par tools/gen_conf_v9.py depuis lib/lvgl-9.6.0/lv_conf_template.h ;
;   - ARDUINO_LOOP_STACK_SIZE=16384 : pile de la tâche loop, correction tranchée le 06/11 par l'essai
;     8 192 / 12 288 / 16 384 (une page profonde crashe à 8 192) — elle RESTE en production ;
;   - -USONDE_INVALIDATION : les compteurs lv_sonde_inv_px/_n sont des ajouts 8.4 (lib/lvgl-8.4.0/src/core/lv_refr.c) ;
;     en 9.6 ils n'existent que dans le patch hors git simu/v9/sonde_invalid_9.6.patch. Sans ce -U : deux références non
;     définies au lien (les seules mesurées).
; La table de partitions est déclarée en chemin absolu (la compilation ESP-IDF la cherche dans le projet et refuse un
; dossier avec des espaces) : large_spiffs_16MB.csv, app0 à 0x10000 et app1 à 0x490000 en 0x480000 chacun — la MÊME que
; la production 8.4 du bureau (cmp de notre copie et de celle de ~/.platformio : identiques octet à octet), sans quoi
; l'OTA depuis la 8.4 pouvait échouer.
; =========================================================================
[env:ecran]
build_src_filter = -<*> +<ecran/> +<ui_lvgl/>
lib_deps =
    ressources
    icones
    lvgl@9.6.0
build_flags =
    -I conf_v9
    ${env.build_flags}
    -USONDE_INVALIDATION
    -DARDUINO_LOOP_STACK_SIZE=16384
; Un envoi raté se relance : l'ESP vérifie le MD5, un envoi raté ne remplace jamais le firmware.
upload_flags = --timeout=30
board_build.partitions = ${platformio.packages_dir}/framework-arduinoespressif32/tools/partitions/large_spiffs_16MB.csv
custom_sdkconfig =
    CONFIG_LWIP_TCP_WND_DEFAULT=32768
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=32
    CONFIG_ESP_WIFI_RX_BA_WIN=16
    CONFIG_ESP_WIFI_IRAM_OPT=y
    CONFIG_ESP_WIFI_RX_IRAM_OPT=y
    CONFIG_LWIP_IRAM_OPTIMIZATION=y
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=n

; Le même firmware par le câble USB (adaptateur CH340 de l'écran) : pio run -e ecran-usb -t upload --upload-port /dev/ttyUSB0
; --timeout=30 est une option d'espota (OTA) : esptool la refuse. 921600 donne des erreurs SLIP avec ce CH340 (vu le 24/10).
[env:ecran-usb]
extends = env:ecran
upload_protocol = esptool
upload_flags =
upload_speed = 460800

; =========================================================================
; BANC DE MESURE (9.6) : le firmware de production + les traces de rendu.
;   pio run -e banc-chambre1-v9 -t upload --upload-port 192.168.1.43
; Historique : créé le 05/11 pour l'A-B-A « rotation 0 / scroll par bande » sur un écran ; la bascule est
; décidée le 05/11 soir et generalisée à tous les écrans le 08/11 (table ECRANS[], toute à 0). Drapeaux conservés tels
; quels : ECRAN_ROT0 ne fait plus rien depuis que la table est à 0 partout (il forçait la rotation 0 à la compilation),
; TRACE_RENDU_MS=8 trace toute image de plus de 8 ms, BILAN_RENDU_S=30 imprime le bilan classé par lignes touchées
; toutes les 30 s. Ne pas flasher cet env sans raison mesurée : c'est du firmware de mesure.
; =========================================================================
[env:banc-chambre1-v9]
extends = env:ecran
build_flags =
    ${env:ecran.build_flags}
    -DECRAN_ROT0
    -DTRACE_RENDU_MS=8
    -DBILAN_RENDU_S=30

; 08/11/2026 au soir : les neuf environnements 8.4 de l'ancien banc sont SORTIS de ce fichier : ils ne compilaient plus
; sur cette branche (les icônes de lib/ressources sont au format 9.6). Les drapeaux de mesure qu'ils portaient restent
; lisibles dans le code : DEFILERAPIDE_OFF, BANC_DECALAGE, MESURE_MSYNC_COMPLET — les re-créer au besoin.

; =========================================================================
; 📝 NOTES DE CONFIGURATION & TENTATIVES D'OPTIMISATION (HISTORIQUE)
; =========================================================================
; 1. TENTATIVES SUR LA MÉMOIRE FLASH (Stockage Code / LittleFS) :
;    - J'ai tenté de forcer la Flash en modes 4 fils (QIO et QOUT) à 120 MHz 
;      pour accélérer au maximum le démarrage et la lecture des fichiers.
;    - Configurations testées : board_build.flash_mode = qio / qout avec 
;      les bootloaders customs (qio_120m, qio_80m, qout_80m).
;    - Résultat : La puce rebascule systématiquement en "mode:DIO" (2 fils) à 
;      80 MHz au boot (verrouillage matériel d'usine via eFuses sur l'ESP32-S3 
;      N16R8V pour éviter les interférences et sécuriser l'alimentation).
;    - Conclusion Flash : On laisse PlatformIO gérer la Flash nativement en DIO.
;
; 2. ÉTAT DE LA PSRAM (Mémoire vive de l'écran / LVGL) :
;    - Configuration active : board_build.arduino.memory_type = qio_opi
;    - Résultat : La PSRAM utilise bien le mode OPI (Octal Peripheral Interface)
;      sur 8 fils en parallèle à 80 MHz. 
;    - Conclusion PSRAM : Ce bus est totalement indépendant de la Flash. L'OPI 
;      est pleinement actif, ce qui garantit l'autoroute de données à 8 fils 
;      nécessaire pour la fluidité parfaite de l'interface graphique LVGL.
; =========================================================================

; Conclusion finale : Le profil réel appliqué par le matériel est un mode "DIO_OPI".
; La Flash est bridée physiquement en DIO (2 fils à 80 MHz) pour éviter les conflits,
; tandis que la PSRAM exploite pleinement l'OPI (8 fils à 80 MHz). L'affichage LVGL 
; reste donc ultra-fluide. Le fichier platformio.ini est stable et validé.