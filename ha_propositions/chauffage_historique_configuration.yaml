  - trigger:
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: Ecran historique exterieur
        unique_id: ecran_historique_exterieur
        state: "{{ now().timestamp() | int }}"
        attributes:
          # sonde nord (locale) ; OpenWeatherMap en secours ; dixièmes de °C, -999 = pas de mesure
          t: >-
            {% set dernier = this.state | int(0) %}{% set manques = (((now().timestamp() - dernier) / 300) | round(0) | int - 1) if dernier else 0 %}{% set manques = [[manques, 0] | max, 288] | min %}{% set prec = this.attributes.get('t', []) | list %}
            {% set n = states('sensor.temperature_nord') %}{% set o = states('sensor.openweathermap_temperature') %}
            {% set v = (n | float * 10) | round(0) | int if n | is_number else ((o | float * 10) | round(0) | int if o | is_number else -999) %}
            {{ (prec + [-999] * manques + [v])[-288:] }}
