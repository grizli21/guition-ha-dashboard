# 23/10/2026 : PROPOSITION (à intégrer chez vous) — automatisations du contrat dashboard_guition pour le poêle.
# PRÉALABLE : les capteurs de poele_configuration.yaml (configuration.yaml).
# À ajouter à la fin de votre automations.yaml (sauvegardez avant, vérifiez que les id sont libres,
# puis automation.reload ; vérifier les messages retenus en lecture seule). Aucune commande de test sur …/set.
# Les anciennes 1791000000130 / 131 (dashboard/poele/…) restent en place pour l'ancien firmware.
# BRASSAGE = purificateur Xiaomi du séjour (derrière le poêle, déjà « ventilo du poêle » : input_boolean.ventilo_poele_auto)
# en préréglage Fan, vitesse 1-3 ; 0 = éteint. Confirmé le 23/10.

- id: '1792200000018'
  alias: Écran · poêle · état
  description: >-
    Contrat dashboard_guition (CONTRAT_MQTT.md) : dashboard_guition/poele/etat, retenu, {fumees, corps, tirage,
    mode auto|manuel|levier, tirage_manuel, feu eteint|allumage|regulation|recharger, consigne, tirage_min, recharge,
    kp, ki, kd, limite, brassage 0-3, en_ligne}. feu : recharger > régulation (PID) > allumage (fumées en hausse de plus
    de 3 °C en 5 min, PID pas en marche) > éteint. Le volet bouge par pas de 0,5 s : délai d'1 s pour regrouper,
    queued max 2 = une publication après le dernier changement (≤ 1 par seconde).
  mode: queued
  max: 2
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id:
        - sensor.poele_fumees
        - sensor.poele_corps
        - sensor.poele_tirage
        - binary_sensor.poele_regulation_en_marche
        - binary_sensor.poele_recharger
        - select.poele_mode_tirage
        - number.poele_consigne_fumees
        - number.poele_tirage_mini
        - number.poele_tirage_manuel
        - number.poele_seuil_recharge
        - number.poele_pid_kp
        - number.poele_pid_ki
        - number.poele_pid_kd
        - number.poele_limite_integrale
        - fan.purificateur
        - number.purificateur_fan_level
    - trigger: homeassistant
      event: start
  actions:
    - delay: 1
    - action: mqtt.publish
      data:
        topic: dashboard_guition/poele/etat
        retain: true
        payload: >-
          {% set m = states('select.poele_mode_tirage') %}
          {% set f = states('sensor.poele_fumees') | float(none) %}
          {% set c = states('sensor.poele_corps') | float(none) %}
          {% set t = states('sensor.poele_tirage') | float(none) %}
          {% set feu = 'recharger' if is_state('binary_sensor.poele_recharger', 'on')
                  else 'regulation' if is_state('binary_sensor.poele_regulation_en_marche', 'on')
                  else 'allumage' if states('sensor.poele_fumees_variation_5_min') | float(0) > 3
                  else 'eteint' %}
          {% set x = 'fan.purificateur' %}
          {{ {'fumees': f | round(0) | int if f is not none else 0,
              'corps': c | round(1) if c is not none else 0,
              'tirage': t | round(0) | int if t is not none else 0,
              'mode': {'Auto': 'auto', 'Manuel distance': 'manuel', 'Manuel local': 'levier'}.get(m, 'auto'),
              'tirage_manuel': states('number.poele_tirage_manuel') | int(0),
              'feu': feu,
              'consigne': states('number.poele_consigne_fumees') | int(0),
              'tirage_min': states('number.poele_tirage_mini') | int(0),
              'recharge': states('number.poele_seuil_recharge') | int(0),
              'kp': states('number.poele_pid_kp') | float(0),
              'ki': states('number.poele_pid_ki') | float(0),
              'kd': states('number.poele_pid_kd') | float(0),
              'limite': states('number.poele_limite_integrale') | int(0),
              'brassage': states('number.purificateur_fan_level') | int(0)
                          if is_state(x, 'on') and state_attr(x, 'preset_mode') == 'Fan' else 0,
              'en_ligne': 0 if m in ['unavailable', 'unknown'] else 1} | tojson }}

- id: '1792200000019'
  alias: Écran · poêle · commandes
  description: >-
    Contrat dashboard_guition : dashboard_guition/poele/set. {"action":"regler", <clé>: <valeur>, …} avec les clés
    consigne, tirage_min, recharge, kp, ki, kd, limite, tirage_manuel (bornes des entités) et mode auto|manuel|levier ;
    {"action":"brassage", "niveau":0-3} (Xiaomi : 0 éteint, 1-3 = préréglage Fan à cette vitesse).
  mode: queued
  triggers:
    - trigger: mqtt
      topic: dashboard_guition/poele/set
  conditions:
    - condition: template
      value_template: >-
        {% set j = trigger.payload_json | default({}) %}
        {{ j is mapping and (j.get('action') == 'regler' or (j.get('action') == 'brassage' and j.get('niveau') in [0, 1, 2, 3])) }}
  variables:
    j: "{{ trigger.payload_json }}"
    reglages:
      - {cle: consigne, entite: number.poele_consigne_fumees, min: 100, max: 400}
      - {cle: tirage_min, entite: number.poele_tirage_mini, min: 0, max: 100}
      - {cle: recharge, entite: number.poele_seuil_recharge, min: 100, max: 300}
      - {cle: kp, entite: number.poele_pid_kp, min: 0, max: 20}
      - {cle: ki, entite: number.poele_pid_ki, min: 0, max: 0.2}
      - {cle: kd, entite: number.poele_pid_kd, min: 0, max: 50}
      - {cle: limite, entite: number.poele_limite_integrale, min: 0, max: 100}
      - {cle: tirage_manuel, entite: number.poele_tirage_manuel, min: 0, max: 100}
  actions:
    - choose:
        - conditions: "{{ j.action == 'brassage' }}"
          sequence:
            - if: "{{ j.niveau == 0 }}"
              then:
                - action: fan.turn_off
                  target: {entity_id: fan.purificateur}
              else:
                - action: fan.set_preset_mode
                  target: {entity_id: fan.purificateur}
                  data: {preset_mode: Fan}
                - action: number.set_value
                  target: {entity_id: number.purificateur_fan_level}
                  data: {value: "{{ j.niveau }}"}
      default:
        - repeat:
            for_each: "{{ reglages | selectattr('cle', 'in', j.keys() | list) | list }}"
            sequence:
              - if: "{{ j[repeat.item.cle] is number }}"
                then:
                  - action: number.set_value
                    target: {entity_id: "{{ repeat.item.entite }}"}
                    data:
                      value: "{{ [[j[repeat.item.cle] | float, repeat.item.min] | max, repeat.item.max] | min }}"
        - if: "{{ j.get('mode') in ['auto', 'manuel', 'levier'] }}"
          then:
            - action: select.select_option
              target: {entity_id: select.poele_mode_tirage}
              data: {option: "{{ {'auto': 'Auto', 'manuel': 'Manuel distance', 'levier': 'Manuel local'}[j.mode] }}"}

- id: '1792200000020'
  alias: Écran · poêle · historique
  description: >-
    Contrat dashboard_guition : dashboard_guition/poele/historique, retenu, {"pas":5, "fumees":[…144…], "corps":[…],
    "tirage":[…]} : 12 h, un point toutes les 5 min, le plus récent en dernier, -1 = pas de mesure. Tenu par HA
    (sensor.ecran_historique_poele) ; republié en entier à chaque point (≈ 1,5 Ko).
  mode: queued
  max: 2
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: sensor.ecran_historique_poele
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: "{{ state_attr('sensor.ecran_historique_poele', 'fumees') | default([], true) | length > 0 }}"
  actions:
    - action: mqtt.publish
      data:
        topic: dashboard_guition/poele/historique
        retain: true
        payload: >-
          {% set e = 'sensor.ecran_historique_poele' %}
          {{ {'pas': 5, 'fumees': state_attr(e, 'fumees') | list, 'corps': state_attr(e, 'corps') | list,
              'tirage': state_attr(e, 'tirage') | list} | tojson }}
