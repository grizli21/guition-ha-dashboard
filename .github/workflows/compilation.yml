name: Compilation

# 13/11/2026 — atelier de compilation : à chaque push et pull request sur main.
#   - le firmware (env « ecran ») compile sur Linux ET Windows ; la variante MODE_DEMO au moins sur Linux ;
#   - le simulateur (make -C simu) tourne sur Linux.
# Les secrets sont recopiés DES GABARITS *.exemple (valeurs factices) : cet atelier n'utilise AUCUN
# secret GitHub. Compilation seule : jamais « -t upload » — l'upload_port d'exemple (192.168.1.43) ne
# sert qu'à satisfaire PlatformIO (sans port OTA déclaré, l'env « ecran » refuse déjà de compiler).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  firmware:
    name: firmware (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 13/11 (3e run) : sous Windows, la 1re compilation (bibliothèques ESP-IDF recompilées, sans cache) a pris 42 min
    # et la tâche a été coupée à 45 pendant l'enregistrement du cache ; Linux : 25 min. Les suivantes repartent du cache.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            demo: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Chemins longs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # La plateforme recompile les bibliothèques ESP-IDF (custom_sdkconfig de platformio.ini) avec
          # des chemins très longs ; Windows est limité à 260 caractères (MAX_PATH) par défaut.
          # Clé LongPathsEnabled + core.longpaths, comme le recommandent Microsoft et le outillage
          # ESP-IDF (voir docs/INSTALLATION.md, section Windows). À confirmer au premier run.
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name 'LongPathsEnabled' -Value 1 -Type DWord -Force
          git config --system core.longpaths true

      - name: PlatformIO Core
        # 13/11 (2e run) : la plateforme crée son propre environnement Python (~/.platformio/penv) et y installe le
        # dernier « pioarduino » : 6.2.0.post1 depuis le 26/10, qu'elle refuse ensuite (« depends on PlatformIO Core
        # >=6.2.0 » : le suffixe post compte comme préversion), au moment de relancer la compilation Arduino. Parade :
        # créer cet environnement AVANT, avec pioarduino 6.2.0 (la plateforme garde un paquet déjà installé s'il convient).
        shell: bash
        run: |
          python -m venv ~/.platformio/penv
          if [ "$RUNNER_OS" = Windows ]; then B=~/.platformio/penv/Scripts; else B=~/.platformio/penv/bin; fi
          "$B/python" -m pip install --upgrade pip
          "$B/python" -m pip install "pioarduino==6.2.0" "platformio==6.2.0"
          # GITHUB_PATH attend un chemin du système : sous Windows, celui de Git Bash (/c/Users/…) est converti
          if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$B" >> "$GITHUB_PATH"; else echo "$B" >> "$GITHUB_PATH"; fi

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-v2-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-v2-

      - name: Secrets factices (gabarits du dépôt, aucun secret GitHub)
        shell: bash
        run: |
          cp src/secrets_mqtt.h.exemple src/secrets_mqtt.h
          cp src/secrets_ma.h.exemple src/secrets_ma.h
          cp src/ecran/secrets_wifi.h.exemple src/ecran/secrets_wifi.h

      # 13/11 (1er run) : sous Windows, PAS de « shell: bash » (Git Bash = MSYS) : l'outillage ESP-IDF refuse
      # « MSys/Mingw is not supported ». PowerShell partout (présent aussi sur ubuntu-latest).
      - name: Compilation (env ecran)
        shell: pwsh
        run: pio run -e ecran

      - name: Compilation (env ecran, MODE_DEMO)
        if: matrix.demo
        shell: pwsh
        env:
          PLATFORMIO_BUILD_FLAGS: -DMODE_DEMO
        run: pio run -e ecran

  simulateur:
    name: simulateur (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances (g++ est déjà sur l'exécuteur ; il manque zlib)
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: make -C simu (compile le vrai code des pages, joue le scénario, écrit les captures)
        run: make -C simu
